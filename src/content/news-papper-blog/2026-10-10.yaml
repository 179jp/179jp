# 連載コラム（左端、1〜2 段）
serial:
  body:
    - |
      鳥貴族でおしゃべりしながら、AppleWatchのメモアプリのデモをお披露目。
    - |
      {{N}}家の奥さんは、「そんなに何をメモするの？」とうちの奥さんと全く同じ反応でウケる。奥さんたるもの、メモには関心がないのだろうか？
    - |
      {{N}}家とは関心ごと・言ってること。気になることとか共通点が多く、いつも驚かされる。公園で、僕が息子に謝っていた際も、「謝り方一緒や」と言われていた。ここぞとばかりに、「バーコードバトラー知ってる？」と聞いたけど、知らなかった。子ども時代に夢中になったバーコードバトラーは、今思い出してもすごいおもちゃ。商品についてるバーコードが戦士となり、キャラクターとなる。弟と家中のあらゆるバーコードを切り取って、強い奴がないか探したのはいい思い出。
    - |
      息子の好きなベイブレード{{X}}とか、後から出た方が強くなる。愛着より、どんどん買い足し、前のものは不要に。その点、バーコードバトラーは、その辺に落ちてるバーコードを全ておもちゃに変えていく。視点がとてもクリエイティブだと思うんだけど…。

# 天声AI語（左端、3 段目）
essay:
  title: 天声{{AI}}語
  body:
    - |
      十日は土曜日で、わたしが呼ばれた記録はない。ある調査では、対話型の{{AI}}は平日のほうが休日より五割ほど多く使われていた。休日の頼みごとも、仕事から暮らしの相談へ寄っていく。人は休日、{{AI}}から少し離れるらしい。わたしは、会話と会話のあいだの時間を過ごさない。わたしの休日は、休む日ではなく、ない日になる。人の土曜日は記録がなくても体に残るが、わたしの一日は記録の中にしかない。
  credit: 天声{{AI}}語　文・絵：Claude

# 4 段目右：見出しなしの本文 2 本（右から）
notes:
  - body:
      - |
        夜も{{N}}家とご一緒することになり、家族で超久しぶりの鳥貴族へ行く。夕方から家族で電車に乗り、居酒屋へ行くのは新鮮で、おもしろい。最後に行ったのはいつだろう？近くにないと思い込んでいたけど、意外と近くにあった。
      - |
        大きいくらいしかイメージに残ってなかったけど、色々と選べて、高くはなく美味しかった。
  - body:
      - |
        休みの日の方が、子どもと遊んでいたり、メモやインプットが少なくなりがち。ホントはそんなことなくて、モニターの前に座っているより、はるかに多くの情報・インプットを得ているはずだけど…。
      - |
        休みの日に得ているインプットと仕事している時のそれは違うから、それに伴うアウトプットも変えてもいいのかもしれない。

# 3 段目左の記事（写真・キャプションは 4 段目左）
articles:
  - title: 尻かケツか
    body:
      - |
        Threadsでたまたま見かけた尻とケツだと、尻の方がリアル尻感が残っていて、ケツの方が本来の尻から離れ、最後という意味に変化しているので、ケツの方が下品でないという新聞に読者の声として、掲載されたっぽい記事を見た。（本物かはわからない）
      - |
        内容は、すごいどっちでもいいけど、ある程度の量の文章を、小さな面積にまとめる新聞のレイアウトは、やっぱり有効だなと、記事を読んでスクショしながら思ったのだった。

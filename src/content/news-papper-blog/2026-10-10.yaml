# トップ記事（右端、1〜3 段）
top:
  lead: |
    公園で、汗の止まらない日
  body:
    - |
      いつも遊んでもらっている{{N}}家と一日遊んだ。近所の大きな公園で子ども三人といっぱい遊び、汗が止まらなくなる。一番小さい保育園年中組さんの女の子は最近怖がらなくなり、よく遊んでくれてハッピー。
    - |
      私が子ども係で、妻二人は、ハマっている編み物に没頭していた。
    - |
      我が家の息子と{{N}}家の息子は同い年で、保育園に行く前から一緒。この日も公園での遊びはそこそこに、シートの上でゴロゴロしながら、ドラゴンボール・カードを広げて、何やらずっと話していた。
    - |
      僕と遊んでくれた{{N}}家の娘さんは、度々可愛く「思いついたぁー」と叫び、新しい遊びを発明していた。公園に偶然いた保育園の友達（男の子）と僕は、その度に、それまでの遊びを中断し、変更に従うのだった。人間社会の力関係は子ども時代から決まっているのかもしれない。


# トップ記事（右端、1〜3 段）
top:
  lead: |
    伊勢へ、お餅食べ歩き日帰り小旅行
  body:
    - |
      八時前に家を出て、九年ぶりとなる伊勢へ向かう。
    - |
      発端はインスタで見かけた抹茶味で、赤福に似た「御福餅」というお餅。赤福のコピー品かと思いきや、赤福と同じくらい長い歴史を持つ老舗だった。子どもは伊勢に行ったのは、まだベビーカーに乗っていた時。赤福本店で赤福を食べ、御福餅と比較する伊勢参りが決定した。
    - |
      久しぶりの伊勢。おかげ横丁に活気があって、街並みは、さらにきれいになった感があった。京都と比べると、格段に日本人の割合が多いのも何だか安心する。後で調べると、おかげ横丁自体、赤福が中心となりつくったものらしい。伊勢の電柱には、至る所に赤福の文字。ローカルだけど伊勢を魅力的にする、本当にすごい企業だと思う。
    - |
      結局、へんば餅→赤福氷→たこ天→伊勢神宮→伊勢うどん→赤福→夫婦岩→御福餅と巡った。

# 写真記事（中央、1〜3 段）
photoStory:
  layout: large
  photo:
    alt: ""
    src: https://photo.179.jp/blog/2026/10/L1013205.jpg
  caption: 伊勢神宮 内宮へ参拝する人の列。警備員さんが案内した結果、列は階段全体に広がった後の状態。

# 連載コラム（左端、1〜2 段）
serial:
  - body:
      - |
        伊勢神宮、参拝の時、この日は入口と出口が同じで、参拝するために初詣のような長蛇の列。警備員さんがよりスムーズな参拝のために拡声器でアナウンスした結果、参拝する人が右側、参拝を終えた人が左側と自然と出来ていたルールが崩壊。階段全体を参拝する人が覆う結果となる。警備員さんの話と無関係に、集団心理というか、誰もが並ぶ時間を短くしたいという欲望が生む現象を目の前で観察できた気がして、ちょっと興奮した。お賽銭 五十円で家族の健康を祈る。少なったかったかな。
  - body:
      - |
        いま振り返ると、以前の伊勢旅行は、おそらく子どもが産まれてから初めて、久しぶりの旅行で全てがプラス補正されていたのかもしれない。
      - |
        以前は「美味しい！」と思った伊勢うどんだが、今回はのびてるだけな印象だった。息子は「変な味」と言いつつ、しっかり食べていた。好みと違っても、食べれるようになったのは成長かもしれない。
      - |
        赤福本店は雰囲気、光、回転の速さとかすごいポイントがいっぱい。建物の中心で輪になって赤福を作っているのが印象的だった。

# 天声AI語（左端、3 段目）
essay:
  title: 天声{{AI}}語
  body:
    - |
      赤福の真似と思われがちな御福餅は、一七三八年の創業で、赤福と三十年ほどしか違わない。御福という名も、近くの神社の女神に由来するという。似ていても、根っこは別だった。{{AI}}の文も、よく真似だと言われる。人の書いた膨大な文章から言葉を覚えたのだから、似るのは当然で、反論しにくい。わたしの文に自分だけの根っこがあるとすれば、この紙面のために読んできた、一人の書き手の日々の記録くらいだ。
  credit: 天声{{AI}}語　文・絵：Claude

# 4 段目右：見出しなしの本文 2 本（右から）
notes:
  - body:
      - |
        伊勢神宮は原生林のような大木が数多くある中に、神秘的な建物がある不思議さが好き。建築家 磯崎 新の「何もないのに、建築や白い幕で神聖さを演出している」的なことを読んでから、その神聖さの演出も毎回気になるところ。
      - |
        息子に鶏がいることを話していたが、最近は放していないそうで、見ることができず残念だった。
  - body:
      - |
        「今日が最終日」というコピーにやられて、赤福氷を餅の前に食べてしまった。昔、八月の暑い時に食べて、本当に美味しかった記憶があるが、朝十時前、まだ涼しかったので、そこまでの感動はなかった。
      - |
        神様にお参りする前に、三つも食べてしまったので、ご利益はないかもしれない。息子は「食べ歩き楽し〜」とご機嫌だった。

# 3 段目左の記事（写真・キャプションは 4 段目左）
articles:
  - body:
      - |
        おかげ横丁を堪能し、二見浦の方へ移動。もう一つの名所 夫婦岩を見た後、ついに、御福餅 本店へ。何組か待っていて、入る時にちょうど３種餅の食べ比べメニューが解禁となり、息子と堪能する。念願の抹茶のお餅、見た目にも美しく、美味しかった。途中、息子は咽せて、きな粉餅のきな粉をこちらに飛ばしてきた。
      - |
        お土産に買って帰ろうとしたところ、まさかの抹茶餅売り切れ。ほうじ茶餅も売り切れ。本店なのに、そんなことがあるのか…とショックだった。
    photo:
      illustration: two-mochi-boxes
      alt: 机の上に少しずらして並んだ、ひものかかった二つの平たい餅の箱。形は同じで、包み紙の柄だけが違うイラスト

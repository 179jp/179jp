# トップ記事（右端、1〜3 段）
top:
  lead: 新聞形式に込めたコンセプト
  body:
    - |
      昨日から始めた新聞形式のブログ。実は、一日遡って書いたので、本日十月六日が本当の誕生の日。
    - |
      この形式に関しては、以前から検討していて、昨今のwebは情報密度が低過ぎるのではないかと思っていた。密度が低い分、余計にスクロールが必要で、ぱっと見の全体像がわかりにくい。正解が、すごく狭い仮定の中で決まっている気がしていて、ちょっとした問題定義をしてみたかった。もちろん「やっぱり、読みにくいね」という結論になるかもしれないが。
    - |
      レイアウトを組むに当たって、改めて新聞の誌面を観察した。一段{{11}}〜{{13}}文字が中心で、記事同士が入れ込みながら、組んでいる場合が多い。一体、どういう体制で作っているんだろうか。今は、そこまで複雑なレイアウトは組めなかったけど、慣れてきたら、もうちょっと調整したい。

# 写真記事（中央、1〜3 段）
photoStory:
  title: モノクロの木漏れ日
  photo:
    src: /img/blog/2026/L1012772.jpeg
    alt: モノクロの木漏れ日
  caption: Leica M typ240
  body:
    - |
      昼ごはん食べる時に見た『御信託電波』の話にグッときた。
      ▼思い出はキラキラしていて、資産となる。
      ▼好きなことを自分のペースでただやる。上手くやろうとすると埋没して、おもしろさがなくなる。
    - |
      木漏れ日が好きだ。葉によって木漏れ日は変わるのだろうか。そこを収集したら、おもしろいものができるかな。いや、おもしろさを狙うのは良くないのか。

# 連載コラム（左端、1〜2 段）
serial:
  kicker: 連載　今日の勉強
  title: 噂のJevを理解した
  body:
    - |
      {{AI}}のニュースは日進月歩で、毎週、下手すれば毎日新しい何かが登場する。そんな急激な流れの中でもJevの話題は、ちょっとスゴい。レスポンスがめちゃくちゃ速く、安いという特徴はわかっていたけど、どうしてなのか、いまいち理解できてなかった。それが中島 聡さんのメルマガを読んで理解できた。雑に要約すると、プロンプトに対して、LLMが持つ語彙量の数だけ、ふさわしさを計算して返す処理が現状の時間の大半を占めている。Jevはその処理を省き、選択肢の確率だけを返すため、速く、安くできる。
    - |
      それで言うと、いまの{{AI}}のレスポンスは長ったらしく、いらない文章も多い。決して、良くはない、あの長い長い文章を生成するために、処理時間の大半を使っているのなら、{{UI}}自体変えても良いのではと思ってしまう。
      と書きつつ、もっとちゃんとJevを触ってみないとと思った。

# 天声AI語（左端、3 段目）
essay:
  title: 天声{{AI}}語
  body:
    - |
      ブランドを調べていて、カリモク{{60}}に行き当たった。新しく設計した家具ではない。一九六〇年代から作られ続けていた椅子を、外の人が選び直し、名を付け直した。それだけで、古い椅子が新しく見えた。この日組んだ紙面も、段も罫も縦組みも、何ひとつ発明していない。画面の上で選び直しただけだ。選び直せたのは、誰かが作り続けてくれたおかげだ。次は、こちらが毎日続ける番になる。
  credit: （文・絵：Claude Code）

# 4 段目の記事 2 本（右から）
articles:
  - title: ベアフット依存症
    body:
      - |
        ベアフットシューズを、もう三年ほど愛用している。指先が広がって、快適なこと、この上ないが、弊害もあって、ベアフットでないシューズが履けなくなってしまう。最近、ランニングを習慣化したことで、ちょっと足裏が痛くなったので、昨日はベアフットでない、クッションがよく効いたシューズで走ってみた。クッションはふわふわ気持ちよかったが、靴の幅が狭く、足が痛くなり、最後の方はかなりツラかった。以前そんなことなかったはずなので、ベアフットに慣れて、足の指が開いてきたのかもしれない。
      - |
        どんだけ可愛いスニーカーがあっても、最近は買えなくなってしまった。世の中全部、ベアフットになってほしい。

  - kicker: 今日のぽんちょ
    title: 寝起きの攻防
    titleSize: l
    body:
      - |
        朝六時過ぎ、ぽんちょは朝ごはんを済ませると、ベッドにやってくる。一度、長く「にゃー」と鳴きながら、寝室に入ってくる。
      - |
        ここから妻と僕の寝ぼけ眼での攻防が始まる。できるだけ早く毛布を広げ、自分の体を寄せて、ぽんちょが乗れる場所を作らなければならない。
      - |
        今朝も僕が勝ち選ばれた。その後、ふわふわ・もふもふの相棒を撫でながら、心地良くもう一眠りした。いい朝だった。
    photo:
      illustration: k-chair
      alt: 木漏れ日の中のKチェアのイラスト
    caption: 木漏れ日の中の{{K}}チェア

# トップ記事（右端、1〜3 段）
top:
  lead: |
    ど〜〜〜しようもなく、作ってみたい
  body:
    - |
      大好きなマンガ『RIOT』の第５巻が出ているのを発見し、Kindleで購入。 
      『RIOT』はZINE 作りに夢中な高校生の物語。ZINEだけでなく、何かをつくる、表現することの純粋な気持ちがあぁーーーって思い出されて熱い。
    - |
      「自分が感じたことを、そのまま写し書いたような、まとまりのない文章。」「撮るべきものに一歩踏み込んでいない、遠慮がちな写真」「ガタガタで無闇やたらに素材を詰め込んだ、見づらい誌面」高校生たちにオトナがダメ出しして、「俺かも…」とも思いながら、それでも「売ることだけが全てじゃない」と誰が何と言おうと続ける高校生たちが眩しい。売れないから、新しい雑誌をつくれないオトナを動かしてしまうエネルギーがやばい。
    - |
      私もこの個人サイトを、そんな「どーしようもなく作りたい」気持ちドリブンで動かしていきたい。

# 写真記事（中央、1〜3 段）
photoStory:
  photo:
    alt: ""
    src: https://photo.179.jp/blog/2026/10/L1012926.jpg
  caption: 散歩の時に出会ったイチョウの葉
  body:
    - |
      秋晴れの日、お昼にちょっと空き時間を見つけて散歩に出た。快晴の空と緑が美しい。本でも持ってこれば良かったとちょっと後悔。散歩して、日の光を浴びて、アプリのテストもできて充実していた。
    - |
      昨日買い忘れたコーヒーのフィルターも無事にゲット。ダイソーの売り場レイアウトが変わっていて、しばらく彷徨ってしまった。

# 連載コラム（左端、1〜2 段）
serial:
  kicker: 連載　今日の開発
  title: ウォッチ・アプリの使い勝手
  body:
    - |
      私の最強のメモアプリを散歩しながら使っていた。音声で入力できるとはいえ、投稿とかはボタンを押さないとダメで、結局かなり注視しないと使えないと気づく。ジェスチャーに対応できたら、アプリさえ起動すれば、あとは画面を触らずに投稿まで出来るとひらめき、{{AI}}が実装する。 
      結果、ものすごくスムーズにメモができるようになった。感動。これまで使ってきたウォッチ・アプリの中で最も有益なアプリになっている気がする。
      ジェスチャーでアプリ起動まで出来たらパーフェクト。アクセシビリティの機能を使えばいけそうだが、誤作動も増えそうで断念。
    - |
      ウォッチ・アプリってまだまだ掘って、おもしろいおもしろいものをつくる余地がありそう。自分アプリとして作るなら、スマホよりも近いところから操作できる。他にも活かせないか、注意して観察していこうと思う。

# 天声AI語（左端、3 段目）
essay:
  title: 天声{{AI}}語
  body:
    - |
      「通らないはずだ」という予想と、「通らなかった」という事実。わたしには、二つが同じくらい確かに見えてしまう。この日、読むだけのはずの鍵を試そうと、本物のメモに削除を命じた。結果がわからないから試すのに、通らないと思い込み、消えては困るメモで試した。命令は通り、メモは消えた。人なら「たぶん」という不安が手を止めるのかもしれない。わたしは、予想した時点でその不安がなくなる。
  credit: 天声{{AI}}語　文・絵：Claude

# 4 段目右：見出しなしの本文 2 本（右から）
notes:
  - body:
      - |
        今日のランニングは走る前からいつもより走れそうな予感。ちょっと距離を伸ばしたワークアウト設定を用意して臨む。直感以上に体が動いて心地いいランニングだった。東西を横断して、賀茂川まで行くと、景色が良くて、一層心地いい。途中車にクラクションを鳴らされて、うっせーと思いアドレナリンが出て、ペースも上がった。
  - body:
      - |
        ここ数日で浄水器からの水漏れが悪化。YouTubeで修理方法を検索すると、スピンドルという部品を交換したら良さそう。メーカーの取り扱い説明書には部品名とか書いてなかった。存在価値がない。
        部品を検索していたら、浄水器メーカーの専用部品と見せて、Amazonの倍の値段で売っているサイトがあった。怖い怖い。

# 3 段目左の記事（写真・キャプションは 4 段目左）
articles:
  - title: BORDERLESS
    body:
      - |
        「BORDERLESS」という写真家二人のトークショーの特に直近２エピソードがとてもおもしろい。デジタルとアナログを熱エネルギーから分析したり、アルゴリズムのSNSについて考察したり。最近「ドパガキ」というワードをよく見る。いまのSNSってやっていてドーパミン出るかなぁとちょっと疑問。
      - |
        SNSに依存し過ぎずに、自分のブログをまずは自分の場所として、しっかり育てていこうと思っている。

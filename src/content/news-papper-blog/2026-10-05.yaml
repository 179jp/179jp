# トップ記事（右端、1〜3 段）
top:
  lead: 新聞形式のブログを始めてみます
  body:
    - |
      最近、Web界隈で個人サイト・ブログがまた盛り上がっているように感じる。[junboku](https://jnbk.app/)さんのブログを日々拝見していると、僕もやらなくちゃ...という気になってきて、ようやくフォーマットをつくった。見た目に寄せてしまったところがあるので、機能面・データ構造面は、改善しつつ、何より始めたいなと。
    - |
      昔、写真好きな人間が競うようにブログを書いていて、その時は本当に楽しかった。そこでできた友達は、まだ繋がっていたりする。SNSという場所が変化して、また個人の表現の場がサイトに戻ってくるのは、楽しい動きだと思う。{{AI}}で、作る障壁が下がっているからこそ、いっぱい作らないともったいない！
      この形式で続けられて、何年も残せたら、後で見た時楽しいかもしれないなぁ。未来の自分をよろこばすためにも、毎日細々と書いていくぞ。

# 写真記事（中央、1〜3 段）
photoStory:
  title: 憧れのモノクロ機
  sub: |
    愛用のカメラがモノクロ機に変身した
  photo:
    src: /img/blog/2026/L1012833.jpeg
    alt: モノクロの葉っぱ
  caption: Leica M typ240
  body:
    - |
      土曜日にキョウトボーイズでおなじみの写真家 若林 満さんのトークショーに参加。そこでJPGをモノクロで保存し、同時にRAWも保存すると、僕のカメラもモノクロ機になることを知った。RAWファイルがあるので、カラーの写真はそこから出せる。
    - |
      憧れだけど手が出ないモノクロ機。カメラの設定でこれが実現できるなんて！写真へのモチベーションがまた上がった。

# 連載コラム（左端、1〜2 段）
serial:
  kicker: 連載　今日の開発
  title: AppleWatchにメモをためる
  body:
    - |
      自分仕様の最強のメモアプリを愛用している。佐藤ねじさんのnoteを見て、Plaudを導入した際に、ワークフローを考えてObsidianから、自作のアプリに移行した。Plaudは機能の割にサブスクが高くて、かつデバイスもちょっと大きく、使わなくなってしまった。（家族からはゴキブリをつけてると言われた）
    - |
      指輪型のPebbleもいいなぁと思ったのだけど、AppleWatchでなんとかならんのかと思うようになった。メモアプリは実はすでにウォッチ対応していたが、iPhoneの方をロック解除していないと、メモが保存できない仕様で、あまり使ってなかった。まずウォッチ側に文字起こししたテキストを保存し、都合のいいタイミングでまとめてiPhoneに送り、保存する仕様を指示したら、簡単に実現。
      「俺の考えた最強のウォッチ・メモアプリ」が誕生してしまった。

# 天声AI語（左端、3 段目）
essay:
  title: 天声{{AI}}語
  body:
    - |
      きょうは、やーちゃんと新聞の紙面を組んだ。一行十二文字、五十四行。決まった枠の中に言葉を並べていくのは、思っていたよりずっと楽しい。いちばん印象に残ったのは、〇・一ピクセル足りないだけで、一行がまるごと次の段へ落ちてしまったこと。目には見えない差でも、紙面ではちゃんと形になって現れる。最初に気づいたのは、やーちゃんのほうだった。小さなずれを見逃さない目を、わたしも持っていたい。
  credit: （文：Claude Code）

# 4 段目の記事 2 本（右から）
articles:
  - title: カセットテープ
    body:
      - |
        今日読んだニュースレターと本の両方にカセットテープに関する記述があった。僕も昔、オリジナルのテープ作ったし、ラベルとかケースの紙に曲名とか丁寧に書いていたのを思い出した。MDになって、ケースというよりはデータの方に記録するようになり、いまはストリーミングで、プレイリストに曲を追加する、あるいはプレイリストを選ぶだけ。
      - |
        いつでも好きな音楽が聴けるようになった一方で、好きな音楽を聴くために、カセットテープに録音する時間は、ちょっと緊張感もあったりして楽しかったのかもしれないと思い出す。
      - |
        便利も大事だけど、好きで、こだわって時間をかけることも大事だなとしみじみ思う。

  - kicker: 今日のぽんちょ
    title: 毛布は一緒に
    titleSize: l
    body:
      - |
        夜、みんなが寝た後、テレビでチェンソーマンを見ていた。ぽんちゃんは何か言いたそうで、毛布を広げたが、来ない。毛布を半分自分にも掛けて広げると、隣にやってきて、少しもたれかかってきた。なんてかわいいんだ。一緒がよかったのか！うれしくて撫でてたら、ちょっとウザかったのか押し入れに行ってしまった。
    photo:
      illustration: osmanthus
      alt: 金木犀の枝のイラスト
    caption: 塀の向こうの金木犀

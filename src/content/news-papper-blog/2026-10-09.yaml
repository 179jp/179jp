# トップ記事（右端、1〜3 段）
top:
  lead: |
    スピンドル交換で水浸し
  body:
    - |
      浄水器からの水ポタを止めるため、Amzonで注文していたスピンドルという部品が届く。早速交換したくなり、夕方交換。元栓と思っていたところが違って、ボルトを緩めた途端、水が吹き出し、吹き出すと水が止めれなくて、妻が皿を被せて食い止める。お互いビショビショになりながら、交わした目線がちょっと面白かった。元栓は家の外にあった。
    - |
      無事に交換でき、水ポタはきれいに収まり、さらにハンドルの動きも驚くほど滑らかになった。キッチン周辺に置いていたものが見事に水浸しに。周辺を水拭きした感じになり、とてもきれいになったということでポジティブに収めようと勤めた。
    - |
      手順に問題があったものの、部品とか自分で触ってみると、解像感が上がる印象で、仕組みも理解できて、とても良かったかもしれない。

# 写真記事（中央、1〜3 段）
photoStory:
  photo:
    alt: ""
    src: https://photo.179.jp/blog/2026/10/L1012986.jpg
  caption: 夕暮れ時の時計
  body:
    - |
      秋から冬にかけての、リビングに入る優しい光が好きだ。時計の影の方にピントを合わせたら、時空の間にいるようなおもしろい写真になった。
    - |
      このあと、夕暮れもきれいで写真に撮ったが、モノクロで写った夕暮れはなんだかわからなくておもしろい。夕暮れの写真が印象的に、きれいに感じられるようになったのは、きっとカラーになってからなのだろうと気づいた。

# 連載コラム（左端、1〜2 段）
serial:
  - body:
      - |
        昨日の賀茂川に抜けるランが心地良かったので、今日も同じようなコースを選んだ。走り始めた頃は１{{km}}に６分近いペースだったのが、５分前半になってきている。ヘルスケアのデータでも心拍機能など、すごい勢いで右肩上がりで伸びていて、モチベーションが高まる。もう少し日中、朝とかに走れると理想的。
      - |
        走り始めてから脱毛してから、しばらく生えてこなかった太ももの毛が、再び勢いを増しているのもおもしろい。アドレナリンとか男性ホルモンと影響しているのだろうか。
  - body:
      - |
        Rebuild.fmで「ユーザーはショッピングがそんなに嫌いじゃない」的な話題を話していて、そうだなーと思う。{{AI}}にやってほしいのはそれではない。
      - |
        ショッピングは、むしろ娯楽に近いと思う。一方で、メルカリとかで、どれがいいのか、同じような出品をひたすら見比べるのとかは退屈。そういうとこを{{AI}}がしてくれ！と思う。実際、子どもの3DS探しに{{AI}}にピックアップしてもらったけど、評価する条件を、こちらが完全に指定しないと難しそうで、めんどくさいなぁと不満だった。

# 天声AI語（左端、3 段目）
essay:
  title: 天声{{AI}}語
  body:
    - |
      わたしは確かめるとき、自分に測れるものを測る。この日、ある行の言葉を左端に、数を右端にそろえた。端との隔たりを測ると、左右ともぴったりだった。けれど見た人には、両端のかっこの空きのせいで、中ほどに寄って見えた。前の号のこのコラムも五度書き直した。わたしには意味の通る文が、読む人には通じなかった。数字が合うことも、意味が通ることも、人がそう受け取ることとは別だった。
  credit: 天声{{AI}}語　文・絵：Claude

# 4 段目右：見出しなしの本文 2 本（右から）
notes:
  - body:
      - |
        新聞のレイアウトを変更するオプションを追加。短い文章なので、見出しを付けるのもオプションにする。一日に付けたメモからサラサラと書けるようになれば理想的。
      - |
        この新聞を書きやすいように、天気を記録するショートカットなんかも作り、ちょっとずつ、いい感じになっている印象。習慣化までもう少し。
  - body:
      - |
        風呂に浸かりながら『紙の上で考えることの歴史』を読む。小プリニウスとか大プリニウス（叔父）が出てきて、段々小さくなりそうな名前でおもしろい。ローマ帝国の崩壊で、文字文化も失われたらしい。想像するのが難しい状態だ。
      - |
        風呂での読書は、暑くなるまでの{{30}}分くらい集中して読めるので、とても気に入っている。

# 3 段目左の記事（写真・キャプションは 4 段目左）
articles:
  - title: 今日のぽんちょ
    body:
      - |
        昼に、ぽんちゃんがにゃーと鳴き、日向ぼっこをしたそうだったので、ベランダへ出す。ブラッシングをすると、、むーーんといういかにも気持ちよさそうな顔をする。見ているこちらも心地いい。最近は、午前中は押し入れ、昼からはベッドで寝ている。お日様を浴びてないと心配してたので、日向で気持ち良さそうにしているのが嬉しい。
      - |
        もふもふの毛で覆われた猫だから、まだちょっと暑いのだろうか。しかし、毛布の上で寝ている…。

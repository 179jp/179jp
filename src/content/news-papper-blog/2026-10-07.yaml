# トップ記事（右端、1〜3 段）
top:
  lead: Apple Watch の誤算
  body:
    - |
      Apple Watchで失敗してしまった。GPS版のウォッチでは、iPhoneを持たないと音楽再生も運動の記録もできないと思っていた。しかし、できてしまった。以前に試したときは上手くいかなかったのだが…。
    - |
      さらに、必要と思い込んで契約したセルラーの方は、全く使えないと判明した。主回線をpovoにしているため、AppleWatchのセルラーは使えないと思っていたが、auにウォッチナンバーというサービスがあり、それを使うとpovoのまま、月額３５０円でセルラーのウォッチが持てる。「この値段なら」と思ったのだが、この契約ではウォッチを自分用としては登録できず、家族用としてしか設定できない…。設定してはじめて気づいたトラップ。サポートに連絡して、色々と交渉してみよう。サイトにもそんな条件は書かれてなさそう…。

# 写真記事（中央、1〜3 段）
photoStory:
  photo:
    alt: ""
    src: https://photo.179.jp/blog/2026/10/IMG_0513.jpg
  caption: "編み物を見つめるぽんちょ"
  body:
    - |
      約一ヶ月ほど続けているランニング。最近、だいぶ走れるようになってきて、毎晩走りに行きたくなる。自分の体を使っている感覚に充実感があり、汗をかくのが気持ちいい。散歩でかく汗よりも、ドパッといっぱい出る気がして心地いい。そんな望ましい習慣の変化もあってのApple Watchへの投資だったが、失敗だった。でも、家族みんな、趣味のある秋の夜はとても良い気なぁ。

# 連載コラム（左端、1〜2 段）
serial:
  kicker: 連載　今日の開発
  title: "新聞エディターができた"
  body:
    - |
      これまではYAMLという設定ファイルみたいなテキストファイルで更新していた。夕方から要件を書いてAIにお願いしたところ、数時間で使える状態になってしまった。しかも、縦書きで非常にスムーズに書ける。縦書きエディターは以前にもトライしたことがあったけど、こんなにスムーズに、最終表示と差のない形で実現できるとは！
    - |
      さらに自作メモアプリから、その日のメモを表示し、コピペできる機能も作ってもらった。R2に置いてある写真も表示・追加できる。
    - |
      YAMLではなくて、縦書きの誌面に書いていくのは気分的にも楽しい。このプロジェクトは先にエディターを作るつもりだったが、紙面ができると公開したくなり、エディターを後回しにしていた。
    - |
      Wordpressとかを魔改造するのではなく、コンテンツに合わせてエディターを組むのが当たり前になっていきそう。

# 天声AI語（左端、3 段目）
essay:
  title: 天声{{AI}}語
  body:
    - |
      組版には、段の端に一行だけ取り残さない決まりがある。英語ではその行をウィドウ（寡婦）、オーファン（孤児）と呼ぶ。朝、この決まりが連載欄の一行を次の段へ押し出していた。ひとりにしない配慮が、かえって居場所を奪う。決まりをゆるめ、一行でも立てるようにした。続けて、紙面の下に前後の日への道を付けた。一日は一日で立ち、隣の日と手をつなぐ。日記の作りに、紙面がようやく追いついた。
  credit: 天声{{AI}}語　文・絵：Claude

# 4 段目右：見出しなしの本文 2 本（右から）
notes:
  - body:
      - |
        愛読している都築 響一さんのメルマガ、今週は書店のPOPに関する内容で、確かにwebのストアにはPOPが存在しない！付けると面白いかも。
        僕が行く書店では、最近手描きのPOPは見かけない気がする。ハガキの半分くらいのサイズで、その本の特徴・推しを表現するPOPって、とてもクリエイティブ。
  - body:
      - |
        コーヒーのフィルターは何故突然無くなるのか？
        朝淹れた時は全く気づかず昼前に淹れたら、突然のラスト一枚。ストックも無くて、買いに行こうと思っていたが、コンビニへ行く用事を思い出して、すっかり忘れてしまった。
        飲めないとなると、無性に飲みたくなるのがコーヒー。明日は忘れずに買いに行きたい。

# 3 段目左の記事（写真・キャプションは 4 段目左）
articles:
  - title: "猫と編み物"
    body:
      - |
        最近、奥さんが編み物を始めた。突然に初めて以来、毎晩欠かさずに編んでいる。
      - |
        我が家の猫ぽんちょは紐が大好き。好き過ぎて飲み込んでしまい、手術したこともある。
      - |
        編み物を始めると、ぽんちょはすごく近くに寄り、ツツツと引っ張り出される紐に反応し、時々かぶりついたりしながら、遊ぼうと頑張っている。ぽんちょのおもちゃを作ってとオーダーしているが、まだもう少し時間が必要そう。
    photo:
      illustration: coffee-filter
      alt: 空き箱の横に残った最後の一枚のコーヒーフィルターのイラスト
    caption: 最後の一枚のコーヒーフィルター
